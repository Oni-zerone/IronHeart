[package]
name = "ironheart"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname", "tokio1-rustls-tls"] }
openidconnect = "4.1.0"
rand = "0.10.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "tls-rustls-ring-webpki", "migrate", "macros", "uuid"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

# Binario più piccolo (l'immagine Docker è solo questo file).
[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"
